services:

  db:
    image: postgres:15
    container_name: ecommerce_db
    restart: always
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: always
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./media:/app/media

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_celery
    command: celery -A src.celery_app.celery_app worker --loglevel=info
    restart: always
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis

volumes:
  postgres_data: