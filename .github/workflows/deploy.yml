name: CI/CD Pipeline Ecommerce Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # 🧪 JOB 1: TESTING (Continuous Integration)
  test:
    runs-on: ubuntu-latest
    services:
      postgres_test_db:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for Postgres..."
          sleep 7

      - name: Create Test Environment File
        working-directory: ./backend
        run: |
          if [ -f .env.docker ]; then
            cp .env.docker .env
            echo ".env.docker copy
          else
            echo "Error: .env.docker not found"
            exit 1
          fi

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Coverage
        working-directory: ./backend
        env:
          DB_HOST: "localhost"
          TEST_DATABASE_URL: "postgresql+asyncpg://test_user:test123@localhost:5432/test_db"
        run: |
          pytest --cov=src

  # JOB 2: DEPLOYMENT (Continuous Deployment)
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}        
          username: ${{ secrets.AWS_EC2_USERNAME }}  
          key: ${{ secrets.AWS_EC2_SSH_KEY }}      
          port: 22
          script: |
            cd /home/ubuntu/ecommerce-platform/backend       
            git pull origin main
            docker compose down
            docker compose up --build -d
            echo "Deployment Successful..."
