name: CI/CD Pipeline Ecommerce Platform

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # 🧪 JOB 1: TESTING (Continuous Integration)
  test:
    runs-on: ubuntu-latest
    services:
      postgres_test_db:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ecommerce_db
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5

      redis_test_cache:
        image: redis:7
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for Postgres..."
        sleep 8

    - name: Install Dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Coverage with Safe Env Injections
      working-directory: ./backend
      env:
        ENV_DOCKER_DATA: ${{ secrets.ENV_DOCKER }}
        DB_HOST: "localhost"
        DB_PORT: "5432"
        DB_USER: "root"
        DB_PASS: "root"
        DB_NAME: "ecommerce_db"
        REDIS_HOST: "localhost"
        REDIS_PORT: "6379"
        TEST_DATABASE_URL: "postgresql+asyncpg://test_user:test123@localhost:5432/test_db"
        CORS_ORIGINS: '["http://localhost:3000", "https://manojbhandarkar.cloud"]'
      run: |
        python -c "import os; open('.env', 'w').write(os.environ.get('ENV_DOCKER_DATA', ''))"
        echo "Environment mapping successful! 📂"
        pytest --cov=src

  # JOB 2: DEPLOYMENT (Continuous Deployment)
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_EC2_HOST }}
        username: ${{ secrets.AWS_EC2_USERNAME }}
        key: ${{ secrets.AWS_EC2_SSH_KEY }}
        port: 22
        script: |
          cd /home/ubuntu/ecommerce-platform/backend       
          git pull origin main
          docker compose down
          docker compose up --build -d
          echo "Deployment Successful..."
